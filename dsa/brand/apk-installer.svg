    </linearGradient>
    <linearGradient id="body" x1="0" y1="30" x2="0" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3bb5e"/>
      <stop offset="1" stop-color="#d98b2b"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="4" x2="0" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3cbf86"/>
      <stop offset="1" stop-color="#0f7a50"/>
    </linearGradient>
  </defs>
  <path d="M12 30H52V53A4 4 0 0 1 48 57H16A4 4 0 0 1 12 53Z" fill="url(#body)"/>
